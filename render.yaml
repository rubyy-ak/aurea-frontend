# Render Blueprint fürs Frontend: statische Vue-Seite.
services:
  - type: web
    name: aurea-parfum
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass # erst deployen, wenn die GitHub-Actions-Tests grün sind
    envVars:
      - key: VITE_API_URL
        value: https://aurea-parfum-api.onrender.com # URL des Backends (kein Geheimnis)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
