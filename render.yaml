# Render Blueprint fürs Frontend: statische Vue-Seite.
services:
  - type: web
    name: aurea-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass # erst deployen, wenn die GitHub-Actions-Tests grün sind
    envVars:
      - key: VITE_API_URL
        sync: false # URL des Backends, z. B. https://aurea-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
